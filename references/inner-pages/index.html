</style></head><body><div class="site"><header class="header"><a class="brand" href="?p=home">PSYIXEL —</a><nav class="nav"><a href="?p=studio" data-page="studio">Studio</a><a href="?p=photography" data-page="photography">Photography</a><a href="?p=art" data-page="art">Art</a><a href="?p=words" data-page="words">Words</a><a href="?p=music" data-page="music">Music</a><a href="?p=about" data-page="about">About</a><a href="?p=contact" data-page="contact">Contact</a></nav><div class="header-meta">20<br>26 //</div></header><div class="page-note">VISUAL PROTOTYPE / Concept art and text are placeholders · Replace with your own work before launch</div><main id="app" class="main"></main><footer class="footer"><a href="?p=home" class="brand">PSYIXEL —</a><p>BETWEEN THE VISIBLE AND THE IMAGINED.<br>AN INDEPENDENT CREATIVE UNIVERSE · 2026</p><a class="mono" href="?p=contact">SAY HELLO ↗</a></footer></div><script>
const A=n=>'assets/'+n;
const media=(f,cls='')=>`<div class="media ${cls}"><img src="${A(f)}" alt="Conceptual visual placeholder" loading="lazy"></div>`;
const tile=(name,sub,img,link='archive')=>`<a class="tile" href="?p=${link}">${media(img)}<div class="label"><div><strong>${name}</strong><span class="mono">${sub}</span></div><span style="font-size:27px">↗</span></div></a>`;
const title=(a,b)=>`<div class="section-head"><h2>${a}<br><span class="ital">${b}</span></h2><span class="eyebrow">PSYIXEL / CREATIVE ARCHIVE</span></div>`;
const pages={
studio:`<section class="hero studio-hero"><h1 class="display">STUDIO</h1><div class="studio-shape"></div><div class="studio-brush"></div><div class="scribble" style="right:20px;top:145px;width:450px;height:150px"></div><div class="statement ital">Ideas into<br>experiences.</div><div class="lede">A creative studio for digital spaces, visual identities, and bold ideas that don't sit neatly in a box.</div><div class="hero-label eyebrow">01 / THE WORK<br>DESIGN · DEVELOPMENT · DIRECTION</div></section><section class="section">${title('WHAT I','Can create')}<div class="thirds"><div class="card"><span class="mono num">01 /</span><h3>WEBSITES &<br>DIGITAL</h3><p>Distinctive sites, portfolios and digital experiences with real purpose.</p><span class="arrow">↗</span></div><div class="card"><span class="mono num">02 /</span><h3>BRAND &<br>IDENTITY</h3><p>Art direction, visual identities and systems built around a point of view.</p><span class="arrow">↗</span></div><div class="card"><span class="mono num">03 /</span><h3>CREATIVE<br>EXPERIMENTS</h3><p>Unusual visual concepts, digital play and projects between disciplines.</p><span class="arrow">↗</span></div></div></section><section class="section studio-projects">${title('SELECTED','Projects')}<div class="thirds">${tile('Red Moon Variations','Concept / Digital Experience','red-moon.jpg','archive')}${tile('Paper Studies','Brand Exploration','studiowork.jpg','archive')}</div></section><section class="section"><div class="split"><h2 class="statement ital">Have something<br>in mind?</h2><div><p class="copy">From an early sketch to a finished digital experience, I'd love to hear what you're imagining.</p><a href="?p=contact" class="btn primary">START A CONVERSATION ↗</a></div></div></section>`,
photography:`<section class="hero photo-hero"><h1 class="display wide">PHOTOGRAPHY</h1><div class="photo-feature media"><img src="${A('portrait.png')}" style="object-fit:contain;object-position:0% 40%;filter:grayscale(1)" alt="Editorial figure placeholder"></div><div class="statement ital">Fragments of the real,<br>the fleeting,<br>the unreal.</div><p class="lede">An archive of fleeting moments, places, strange light, and everything that refuses to stay.</p><div class="paper media">${'<img src="'+A('moon-landscape.jpg')+'" alt="Moon photograph placeholder">'}</div><div class="scribble" style="right:30px;top:265px;width:420px;height:80px"></div><span class="hero-label eyebrow">02 / THE EYE · COLLECTIONS</span></section><section class="section">${title('PHOTO','Collections')}<div class="filters"><button class="btn selected" type="button">ALL</button><button class="btn" type="button">PEOPLE</button><button class="btn" type="button">PLACES</button><button class="btn" type="button">NATURE</button></div><div class="thirds">${tile('The In-Between','People / Film Study','motion-photo.jpg','photography')}${tile('Celestial Notes','Sky / Landscape','moon-landscape.jpg','photography')}${tile('Somewhere Else','Landscape / Atmosphere','horizon.jpg','photography')}</div></section><section class="section"><div class="split"><div>${media('flower-print.jpg','frame')}</div><div><div class="eyebrow">PERSONAL NOTE / 001</div><h2 class="statement ital">What remains<br>after the moment?</h2><p class="copy">Photography is a way of keeping a small piece of the world before it moves on.</p></div></div></section>`,
art:`<section class="hero art-hero"><h1 class="display">ART</h1><img class="art-swipe" src="${A('abstract-art.jpg')}" alt="Lavender paint composition"><div class="statement ital">A space for<br>experimentation,<br>expression, and play.</div><p class="lede">Images, objects and ideas that exist simply because they needed to take shape.</p><span class="aster">✳</span><span class="hero-label eyebrow">03 / THE IMAGINATION · WORKS</span></section><section class="section">${title('VISUAL','Experiments')}<div class="split">${tile('Lavender Studies','Mixed Media / Series','abstract-art.jpg','art')}${tile('The Second Nature','Sculpture / Collage','statuework.jpg','art')}${tile('Botanical Fragments','Experimental / Collage','flower-print.jpg','art')}${tile('After the Moon','Digital / Surreal','moon-landscape.jpg','art')}</div></section><section class="section"><div class="split"><div class="statement ital">Art doesn't have<br>to explain itself.</div><div><p class="copy">Some work begins with an idea. Other work begins with an image, an accident, or simply curiosity.</p><div class="tags"><span>COLLAGE</span><span>PAINTING</span><span>DIGITAL</span><span>EXPERIMENTAL</span></div></div></div></section>`,
words:`<section class="hero words-hero"><h1 class="display">Words</h1><div class="statement ital">Notes, essays,<br>fragments, and<br>other forms of writing.</div><p class="lede">On perception, distance, memory, wonder, and the spaces between all of them.</p><div class="words-paper"><span>Some things I have not yet said<br>belong to the wind, or to a quiet<br>evening when the world is still.</span></div><span class="hero-label eyebrow">04 / THE MIND · JOURNAL</span></section><section class="section">${title('FROM THE','Journal')}<div class="article-row"><span class="mono accent">01 /</span><a href="#featured-essay">The Weight of the Everyday</a><span class="mono date">ESSAY · 2026</span><span class="mono reading">8 MIN</span><span>↗</span></div><div class="article-row"><span class="mono accent">02 /</span><a href="#featured-essay">On Absence and Distance</a><span class="mono date">ESSAY · 2026</span><span class="mono reading">6 MIN</span><span>↗</span></div><div class="article-row"><span class="mono accent">03 /</span><a href="#featured-essay">Fragments from a Moving Mind</a><span class="mono date">NOTES · 2026</span><span class="mono reading">4 MIN</span><span>↗</span></div><div class="article-row"><span class="mono accent">04 /</span><a href="#featured-essay">The Second Nature</a><span class="mono date">REFLECTION · 2026</span><span class="mono reading">7 MIN</span><span>↗</span></div></section><section class="section" id="featured-essay"><div class="eyebrow">FEATURED / ESSAY EXCERPT — SAMPLE</div><div class="featured-quote">“Some memories are not lost; they simply become another kind of landscape.”</div><p class="copy">This is placeholder writing. The final Words section will feature your actual essays, reflections and poetry in an uninterrupted reading experience.</p></section>`,
music:`<section class="hero music-hero"><h1 class="display">MUSIC</h1><div class="statement ital">Soundscapes for<br>the in-between —<br>moods, memories,<br>imagined places.</div><p class="lede">Collections, playlists, original sounds and experiments. A place to listen more closely.</p><div class="vinyl" aria-label="Decorative vinyl record"></div><div class="smallwave wave">${Array.from({length:30},(_,i)=>`<i style="height:${11+Math.abs(Math.sin(i*.65))*58}px"></i>`).join('')}</div><span class="hero-label eyebrow">05 / THE SOUND · LISTEN</span></section><section class="section">${title('NOW','Listening')}<div class="player">${media('red-moon.jpg')}<div><div class="eyebrow">CONCEPT PLAYER / AUDIO NOT PROVIDED</div><h3 style="font:29px Georgia,serif;margin:16px 0 5px">Red Moon Variations</h3><div class="mono">PSYIXEL · SOUND EXPERIMENT</div><div class="rule"></div><div class="mono">UPLOAD AUDIO TO ENABLE PLAYBACK</div></div><div class="wave">${Array.from({length:30},(_,i)=>`<i style="height:${10+Math.abs(Math.sin(i*.65))*62}px"></i>`).join('')}</div></div></section><section class="section">${title('SONIC','Archive')}<div class="track"><span class="mono accent">01</span><span>Red Moon Variations</span><span class="mono">SOUND EXPERIMENT</span><span>↗</span></div><div class="track"><span class="mono accent">02</span><span>Fragments, Vol. I</span><span class="mono">PLAYLIST</span><span>↗</span></div><div class="track"><span class="mono accent">03</span><span>Quiet Frequencies</span><span class="mono">COLLECTION</span><span>↗</span></div></section><section class="section"><p class="copy">The actual music page can embed your licensed playlists and play audio you own or are authorized to share. This prototype has no autoplay or fake audio.</p></section>`,
about:`<section class="hero about-hero"><h1 class="display">ABOUT</h1><div class="lavtext">Psyixel.</div><img class="statue" src="${A('marble.jpg')}" alt="Statue artwork placeholder"><div class="statement ital">One creative identity.<br>Many ways of seeing.</div><p class="lede">Psyixel is an independent creative practice and personal universe — part studio, part archive, part diary, part playground.</p><div class="about-moon"></div><span class="hero-label eyebrow">BEHIND THE WORK / THE PHILOSOPHY</span></section><section class="section"><div class="split"><div><div class="eyebrow">THE STORY / INTRODUCTION</div><h2 class="statement ital">Curiosity is<br>the common thread.</h2></div><div><p class="copy">I build digital experiences, photograph what catches my eye, make art to explore ideas, write what I cannot leave unsaid, and collect sounds that stay with me.</p><p class="copy">These disciplines are not separate identities. They're different ways of approaching the same question: how do we make something meaningful out of what we see and feel?</p></div></div></section><section class="section">${title('THE FIVE','Worlds')}<div class="thirds"><div class="card"><span class="mono num">01</span><h3>STUDIO</h3><p>Ideas for other people.</p></div><div class="card"><span class="mono num">02</span><h3>PHOTO</h3><p>The world through a lens.</p></div><div class="card"><span class="mono num">03</span><h3>ART</h3><p>The world reshaped.</p></div><div class="card"><span class="mono num">04</span><h3>WORDS</h3><p>The world in language.</p></div><div class="card"><span class="mono num">05</span><h3>MUSIC</h3><p>The world in frequencies.</p></div></div></section>`,
contact:`<section class="hero short contact-hero"><h1 class="display">GET IN<br><span class="lav">TOUCH.</span></h1><div class="statement ital">Let's create<br>something<br>unconventional.</div><span class="aster">✳</span><span class="hero-label eyebrow">PROJECTS / COLLABORATIONS / CONVERSATIONS</span></section><section class="contact-columns"><div><div class="eyebrow">CHOOSE YOUR OWN ADVENTURE</div><div class="contact-options"><a href="mailto:hello@psyixel.example?subject=Project%20inquiry">PROJECT INQUIRY <span>↗</span></a><a href="mailto:hello@psyixel.example?subject=Collaboration">COLLABORATE <span>↗</span></a><a href="mailto:hello@psyixel.example?subject=Hello">SAY HELLO <span>↗</span></a></div><p class="mono" style="margin-top:30px">The .example address is a placeholder — replace before launch.</p><div class="media" style="height:280px;max-width:380px;margin-top:55px">${'<img src="'+A('horizon.jpg')+'" alt="Misty landscape placeholder">'}</div></div><form class="contact-form" id="contact-form"><div class="eyebrow">SEND A MESSAGE / DEMO FORM</div><label for="name">YOUR NAME</label><input id="name" required placeholder="Name"><label for="email">YOUR EMAIL</label><input id="email" type="email" required placeholder="Email"><label for="subject">WHAT'S ON YOUR MIND?</label><input id="subject" placeholder="Project, collaboration, something else"><label for="message">MESSAGE</label><textarea id="message" required placeholder="Tell me about your idea..."></textarea><button class="btn primary" type="submit">PREVIEW MESSAGE ↗</button><p class="message" id="form-message" role="status">Prototype only. No messages are sent.</p></form></section>`,
archive:`<section class="hero short"><h1 class="display" style="font-size:135px">SELECTED<br>WORK<span class="ital accent" style="font-size:115px"> Archive.</span></h1><p class="lede">A curated selection of things made, captured, written, imagined and heard.</p></section><section class="section"><div class="thirds">${tile('Red Moon Variations','Music / Digital','red-moon.jpg','music')}${tile('The Second Nature','Art / Collage','statuework.jpg','art')}${tile('A Quiet Exit','Photography / Series','quietexit.jpg','photography')}${tile('Fragments Vol. I','Music / Playlist','cassette.jpg','music')}${tile('Lavender Studies','Art / Mixed Media','abstract-art.jpg','art')}${tile('Paper Studies','Studio / Digital','studiowork.jpg','studio')}</div></section>`,
home:`<section class="hero" style="min-height:900px"><h1 class="display" style="font-size:250px">PSYIXEL</h1><img src="${A('portrait.png')}" class="collage-img" style="height:690px;left:28%;top:150px" alt="Portrait cutout"><img src="${A('iris.png')}" class="collage-img" style="width:520px;left:0;bottom:0" alt="Lavender flower"><img src="${A('eye.png')}" class="collage-img" style="width:220px;right:0;top:0" alt="Lavender eye"><div class="statement ital" style="position:absolute;right:0;top:390px;text-align:right">Between the visible<br>and the imagined.</div><div class="hero-label eyebrow">STUDIO / PHOTOGRAPHY / ART / WORDS / MUSIC</div></section><section class="section">${title('A CREATIVE','Universe')}<div class="quart">${tile('STUDIO','Digital work','studiowork.jpg','studio')}${tile('PHOTO','Visual stories','motion-photo.jpg','photography')}${tile('ART','Experiments','abstract-art.jpg','art')}${tile('WORDS','Essays and notes','handwriting.jpg','words')}${tile('MUSIC','Sounds','vinyl.jpg','music')}</div></section>`
};
let page=new URLSearchParams(location.search).get('p')||'studio';if(!pages[page])page='studio';document.querySelector('#app').innerHTML=pages[page];document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===page)a.classList.add('active')});document.title=`PSYIXEL / ${page[0].toUpperCase()+page.slice(1)} — Design concept`;
const form=document.getElementById('contact-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();document.getElementById('form-message').textContent='Preview validated. Connect a form service to enable real delivery.'});
document.querySelectorAll('.filters .btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters .btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));
